name: Build Joomla extension release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate module
        run: |
          php -l mod_3cxbyfrydendal/mod_3cxbyfrydendal.php
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("mod_3cxbyfrydendal/mod_3cxbyfrydendal.xml")
          PY
      - name: Build Joomla install ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE="mod_3cxbyfrydendal_${VERSION}.zip"
          mkdir -p build
          cd mod_3cxbyfrydendal
          zip -r "../build/${PACKAGE}" . -x "*.DS_Store"
      - name: Create GitHub Release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "${RELEASE_TAG}" "build/mod_3cxbyfrydendal_${VERSION}.zip" \
            --title "3CX by Frydendal ${VERSION}" \
            --generate-notes
